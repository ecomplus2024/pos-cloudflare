name = "pos-demo"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Phục vụ React frontend từ thư mục public/ cùng Worker
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database - binding tên DB sẽ thay bằng ID thật sau khi wrangler d1 create
[[d1_databases]]
binding = "DB"
database_name = "pos-free"
database_id = "9dd2600b-5b43-4976-baf5-5c86d1c74748"

[vars]
STORE_NAME = "Quán Cà Phê Demo"
