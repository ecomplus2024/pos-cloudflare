name = "pos-demo"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Phục vụ React frontend từ thư mục public/ cùng Worker
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database - binding tên DB sẽ thay bằng ID thật sau khi wrangler d1 create
[[d1_databases]]
binding = "DB"
database_name = "pos-demo-db"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[vars]
STORE_NAME = "Quán Cà Phê Demo"
