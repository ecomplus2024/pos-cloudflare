<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu POS Demo</title>
    <meta name="description" content="Demo POS chạy trên Cloudflare Workers + D1" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* Custom utilities cho PublicMenu (primary blue palette + animations) */
      .bg-primary-50 { background-color: #eff6ff; }
      .bg-primary-100 { background-color: #dbeafe; }
      .bg-primary-200 { background-color: #bfdbfe; }
      .bg-primary-400 { background-color: #60a5fa; }
      .bg-primary-500 { background-color: #3b82f6; }
      .bg-primary-600 { background-color: #2563eb; }
      .bg-primary-700 { background-color: #1d4ed8; }
      .bg-primary-800 { background-color: #1e40af; }
      .bg-primary-900 { background-color: #1e3a8a; }
      .text-primary-100 { color: #dbeafe; }
      .text-primary-200 { color: #bfdbfe; }
      .text-primary-400 { color: #60a5fa; }
      .text-primary-500 { color: #3b82f6; }
      .text-primary-600 { color: #2563eb; }
      .text-primary-700 { color: #1d4ed8; }
      .text-primary-800 { color: #1e40af; }
      .border-primary-200 { border-color: #bfdbfe; }
      .border-primary-400 { border-color: #60a5fa; }
      .border-primary-500 { border-color: #3b82f6; }
      .border-primary-600 { border-color: #2563eb; }
      .ring-primary-400 { --tw-ring-color: #60a5fa; }
      .sticky-top-72 { position: sticky; top: 72px; z-index: 10; }
      .sticky-top-120 { position: sticky; top: 120px; z-index: 10; }
      @keyframes pulse-ring {
        0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
        100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
      }
      @keyframes blob {
        0%, 100% { transform: translate(0,0) scale(1); }
        33% { transform: translate(30px,-50px) scale(1.1); }
        66% { transform: translate(-20px,20px) scale(0.9); }
      }
      .animate-wiggle { animation: wiggle 0.5s ease-in-out; }
      .animate-pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }
      .animate-blob { animation: blob 7s infinite; }
      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }
      .animate-bounce-slow { animation: bounce 2s infinite; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .animate-in { animation-duration: 200ms; animation-fill-mode: forwards; }
      .fade-in { animation-name: fadeIn; }
      .slide-in-from-bottom { animation-name: slideInFromBottom; }
      .zoom-in-95 { animation-name: zoomIn95; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInFromBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes zoomIn95 { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes slideInRight { from { transform: translateX(120%); } to { transform: translateX(0); } }
      .animate-slide-in-right { animation: slideInRight 0.3s ease-out; }

      /* Responsive grid - Tailwind standalone CLI v4 không expand safelist */
      @media (min-width: 640px) {
        .sm\:grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .sm\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .sm\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .sm\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .sm\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .sm\:grid-cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        .sm\:flex { display: flex; }
        .sm\:p-4 { padding: 1rem; }
        .sm\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .sm\:py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .sm\:w-auto { width: auto; }
        .sm\:flex-row { flex-direction: row; }
        .sm\:justify-between { justify-content: space-between; }
        .sm\:items-center { align-items: center; }
        .sm\:gap-4 { gap: 1rem; }
        .sm\:gap-2 { gap: 0.5rem; }
        .sm\:max-w-md { max-width: 28rem; }
        .sm\:rounded-lg { border-radius: 0.5rem; }
        .sm\:text-5xl { font-size: 3rem; line-height: 1; }
      }
      @media (min-width: 768px) {
        .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .md\:flex { display: flex; }
        .md\:p-10 { padding: 2.5rem; }
        .md\:p-6 { padding: 1.5rem; }
        .md\:p-4 { padding: 1rem; }
        .md\:p-3 { padding: 0.75rem; }
        .md\:p-2 { padding: 0.5rem; }
        .md\:p-5 { padding: 1.25rem; }
        .md\:text-5xl { font-size: 3rem; line-height: 1; }
        .md\:text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .md\:text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .md\:text-base { font-size: 1rem; line-height: 1.5rem; }
        .md\:text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .md\:w-48 { width: 12rem; }
        .md\:max-w-md { max-width: 28rem; }
        .md\:rounded-2xl { border-radius: 1rem; }
        .md\:rounded-3xl { border-radius: 1.5rem; }
        .md\:py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .md\:gap-2 { gap: 0.5rem; }
        .md\:gap-3 { gap: 0.75rem; }
        .md\:gap-4 { gap: 1rem; }
      }
      @media (min-width: 1024px) {
        .lg\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .lg\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .lg\:max-w-2xl { max-width: 42rem; }
        .lg\:text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .lg\:text-base { font-size: 1rem; line-height: 1.5rem; }
        .lg\:gap-2 { gap: 0.5rem; }
        .lg\:gap-3 { gap: 0.75rem; }
        .lg\:gap-4 { gap: 1rem; }
      }
    </style>
  </head>
  <body class="bg-stone-50">
    <div id="root"></div>
    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone để transform JSX trong browser -->
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <!-- App JSX -->
    <script type="text/babel" data-presets="react" data-type="module" src="/app.jsx"></script>
  </body>
</html>
